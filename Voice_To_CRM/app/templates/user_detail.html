{% extends "base.html" %}
{% block title %}{{ u.name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ u.name }}</h1>
    <p>{{ u.email }} · {{ _("Administrator") if u.role == 'admin' else _("User") }}</p>
  </div>
  <div class="actions"><a class="btn" href="{{ url_for('main.users') }}">{{ _("Back to users") }}</a></div>
</div>
{% include "_user_card.html" %}
{% endblock %}
